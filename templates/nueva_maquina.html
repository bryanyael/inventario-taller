<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Nueva Máquina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="fw-bold mb-3">🛠️ Registrar Nueva Máquina</h4>
                    <form action="/admin/nueva_maquina" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Código de la Máquina</label>
                            <input type="text" name="codigo" class="form-control" placeholder="Ej. MAQ-01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" name="marca" class="form-control" placeholder="Ej. Caterpillar" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" name="modelo" class="form-control" placeholder="Ej. CAT-320D" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de Serie</label>
                            <input type="text" name="numero_serie" class="form-control" placeholder="Ej. SN-998877">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text" name="ubicacion" class="form-control" value="Taller">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Máquina</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
