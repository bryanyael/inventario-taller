<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Pieza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 500px;">
        <div class="card card-custom bg-white p-4">
            <h4 class="fw-bold text-dark mb-1"><i class="bi bi-clipboard-check text-success me-2"></i>Registro de Extracción</h4>
            <p class="text-muted small mb-3">Máquina <strong>{{ codigo }}</strong> — {{ pieza.nombre }}</p>
            
            <form action="/enviar_solicitud" method="POST">
                <input type="hidden" name="codigo" value="{{ codigo }}">
                <input type="hidden" name="pieza_id" value="{{ pieza.id }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre del Técnico</label>
                    <input type="text" name="tecnico" class="form-control form-control-lg" placeholder="Ej: Carlos Pérez" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Motivo de Extracción</label>
                    <textarea name="motivo" class="form-control" rows="3" placeholder="Ej: Mantenimiento preventivo..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Fecha Estimada de Regreso</label>
                    <input type="date" name="fecha_regreso" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3 mb-2">
                    Confirmar Extracción
                </button>
                <a href="/maquina/{{ codigo }}" class="btn btn-light w-100 text-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
