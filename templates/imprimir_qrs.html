<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas QR - Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .qr-card {
            border: 2px dashed #000;
            border-radius: 12px;
            background: white;
            padding: 15px;
            text-align: center;
            width: 220px;
            display: inline-block;
            margin: 10px;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .qr-card { border: 2px solid #000; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="no-print d-flex justify-content-between align-items-center mb-4">
            <h2>🖨️ Generador de Etiquetas QR</h2>
            <div>
                <button onclick="window.print()" class="btn btn-primary rounded-pill fw-bold">
                    <i class="bi bi-printer me-1"></i> Imprimir Etiquetas (Ctrl + P)
                </button>
                <a href="/" class="btn btn-outline-secondary rounded-pill ms-2">Inicio</a>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-start">
            {% for cod, datos in maquinas.items() %}
            <div class="qr-card shadow-sm">
                <span class="badge bg-dark mb-1">{{ cod }}</span>
                <h6 class="fw-bold mb-2 text-truncate">{{ datos.marca }} {{ datos.modelo }}</h6>
                <img src="{{ qrs[cod] }}" class="img-fluid rounded border p-1 mb-2" style="max-width: 170px;">
                <p class="small text-muted mb-0"><i class="bi bi-camera me-1"></i>Escanea para ver repuestos</p>
            </div>
            {% else %}
            <p class="text-muted">No hay máquinas registradas aún.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
