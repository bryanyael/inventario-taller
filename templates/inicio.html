
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Taller</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #1a252f;
            margin-bottom: 10px;
            font-size: 26px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s ease;
            font-size: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        .btn-success:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚙️ Sistema de Taller</h1>
        <p>Gestión de repuestos, préstamos y trazabilidad de maquinaria.</p>

        <div class="btn-group">
            <a href="/admin/nueva_maquina" class="btn btn-primary">➕ Registrar Nueva Máquina</a>
            <a href="/admin/imprimir_qrs" class="btn btn-success">🖨️ Imprimir Códigos QR</a>
            <a href="/admin/registros" class="btn btn-secondary">📋 Ver Historial de Movimientos</a>
        </div>
    </div>

</body>
</html>
