<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Máquina</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f8; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🖨️ Registrar Nueva Máquina</h2>
        <form action="/admin/nueva_maquina" method="POST">
            <label>Código ID (ej. M2040-003):</label>
            <input type="text" name="codigo" required>

            <label>Marca:</label>
            <input type="text" name="marca" placeholder="Kyocera, Ricoh..." required>

            <label>Modelo:</label>
            <input type="text" name="modelo" placeholder="M2040, MP301..." required>

            <label>Número de Serie:</label>
            <input type="text" name="numero_serie" required>

            <label>Ubicación:</label>
            <input type="text" name="ubicacion" value="Taller" required>

            <button type="submit">SIGUIENTE: AGREGAR PIEZAS →</button>
        </form>
        <a href="/" style="display:block; text-align:center; color:#666; text-decoration:none;">← Cancelar</a>
    </div>
</body>
</html>
