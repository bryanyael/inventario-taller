<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Imprimir Etiquetas QR de Máquinas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .label-card {
            border: 2px dashed #000;
            padding: 15px;
            width: 220px;
            text-align: center;
            border-radius: 8px;
            page-break-inside: avoid;
        }
        .btn-print {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }
        @media print {
            .btn-print { display: none; }
        }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Etiquetas en Papel / Adhesivo</button>

    <div class="grid">
        {% for cod, maq in maquinas.items() %}
            <div class="label-card">
                <h3 style="margin: 0;">{{ maq.marca }} {{ maq.modelo }}</h3>
                <p style="margin: 5px 0;"><strong>ID: {{ cod }}</strong></p>
                <img src="{{ qrs[cod] }}" width="170" height="170" alt="QR {{ cod }}">
                <p style="margin: 0;"><small>Escanea para ver repuestos disponibles</small></p>
            </div>
        {% endfor %}
    </div>

</body>
</html>
